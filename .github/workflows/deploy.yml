# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      # Vite inlines VITE_* at build time. This job builds in GitHub Actions,
      # so netlify.toml [context.*] env vars are never applied. Missing this
      # compiles VITE_GQL_URI to undefined and login hits /undefined/graphql (404).
      VITE_GQL_URI: ${{ vars.VITE_GQL_URI || 'https://sendmagnet.com' }}

    strategy:
      matrix:
        node-version: [19.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm install
    - run: npm run build --if-present
      env:
        # Vite inlines VITE_* vars at build time. The build runs here in CI (not on
        # Netlify), so netlify.toml's [context.*] environment blocks do NOT apply.
        # Without this, import.meta.env.VITE_GQL_URI compiles to `undefined`, producing
        # requests to `<host>/undefined/graphql` (404). Override via a repo variable if needed.
        VITE_GQL_URI: ${{ vars.VITE_GQL_URI || 'https://sendmagnet.com' }}
    - run: npm test
    - name: Deploy to Netlify
      uses: nwtgck/actions-netlify@v1.2
      with:
        publish-dir: './dist'
        production-deploy: true
        production-branch: main
        github-token: ${{ secrets.GH_TOKEN }}
        deploy-message: "Deploy from GitHub Actions"
        enable-pull-request-comment: false
        enable-commit-comment: true
        overwrites-pull-request-comment: true
        netlify-config-path: ./netlify.toml
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
